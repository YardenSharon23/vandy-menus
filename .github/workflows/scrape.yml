name: Scrape Vanderbilt menus

on:
  schedule:
    - cron: "0 10 * * *"   # every day at 10:00 UTC (4–5 AM Nashville time)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Scrape today and tomorrow
        shell: pwsh
        run: |
          $tz = [TimeZoneInfo]::FindSystemTimeZoneById('America/Chicago')
          $today = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz).Date
          New-Item -ItemType Directory -Force docs/menus | Out-Null
          foreach ($d in @($today, $today.AddDays(1))) {
            ./scrape-menus.ps1 -Date $d -Out ("docs/menus/{0:yyyy-MM-dd}.json" -f $d)
          }

          # Keep the last 14 days, and write an index of available dates
          Get-ChildItem docs/menus -Filter '????-??-??.json' |
            Where-Object { [datetime]::ParseExact($_.BaseName, 'yyyy-MM-dd', $null) -lt $today.AddDays(-14) } |
            Remove-Item
          $dates = Get-ChildItem docs/menus -Filter '????-??-??.json' | ForEach-Object BaseName | Sort-Object
          @{ updated = (Get-Date).ToUniversalTime().ToString('o'); dates = @($dates) } |
            ConvertTo-Json -Compress | Out-File -Encoding utf8 docs/menus/index.json

      - name: Commit updated menus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Menus for $(TZ=America/Chicago date +%F)"
          git push

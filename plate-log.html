<title>Plate Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one navy column. Calorie gauge, protein bar, slim carbs/fat line, then today's entries (tap to edit). Chat thread below; pinned composer led by a big camera button. Every log goes through a review sheet. */
:root{
  color-scheme:dark;
  --bg:#0f121b; --panel:#171b28; --panel-2:#1e2333; --line:rgba(255,255,255,.06); --edge:rgba(255,255,255,.1);
  --ink:#f1f4fb; --muted:#8a91a6; --faint:#575e72;
  --blue:#3d7bff; --blue-2:#5fa0ff; --cyan:#8fd8ff; --glow:rgba(77,140,255,.5);
  --carb:#f2c46b; --fat:#c79bff; --good:#3ddc84; --bad:#ff6b78;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --blur:blur(22px) saturate(150%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(32rem 24rem at 92% -8%, rgba(61,123,255,.22), transparent 62%),
             radial-gradient(26rem 22rem at -12% 46%, rgba(143,216,255,.08), transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}

.app{position:relative;z-index:1;max-width:500px;margin:0 auto;padding-block:22px 190px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0}
.top .sub{font-size:.8rem;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:19px;height:19px}

/* Gauge */
.hero{display:flex;flex-direction:column;gap:22px;padding:8px 4px 0}
.gauge{position:relative;width:100%;max-width:330px;margin:0 auto}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge .center{position:absolute;left:0;right:0;bottom:2%;text-align:center}
.gauge .kcal{font-family:var(--display);font-weight:700;font-size:clamp(2.8rem,14vw,3.5rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .of{font-size:.84rem;color:var(--muted);margin-top:8px}
.gauge .left{font-size:.8rem;font-weight:600;color:var(--cyan);min-height:1.2em}
.gauge .left.over{color:var(--bad)}
.pro .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lab{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pro .val{font-family:var(--display);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
.pro .val small{color:var(--muted);font-size:.82rem;font-weight:500}
.track{height:10px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:9px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-2) 70%,var(--cyan));
  box-shadow:0 0 12px var(--glow);transition:width .6s ease}
.minor{display:flex;gap:18px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.minor b{color:var(--ink);font-weight:600}
.minor i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:2px}

/* Entries */
.log{display:flex;flex-direction:column;gap:10px}
.log[hidden]{display:none}
.log .lab{padding:0 4px}
.entries{background:var(--panel);border-radius:20px;padding:2px 6px}
.entry{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 10px;border-top:1px solid var(--line);border-radius:12px}
.entry:first-child{border-top-color:transparent}
.entry:hover{background:rgba(255,255,255,.025)}
.entry .ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(61,123,255,.14);color:var(--blue-2)}
.entry .ic svg{width:18px;height:18px}
.entry .t{flex:1;min-width:0}
.entry .t b{display:block;font-weight:600}
.entry .t small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .n{text-align:right;font-variant-numeric:tabular-nums}
.entry .n b{font-family:var(--display);font-weight:600;font-size:.95rem}
.entry .n small{display:block;color:var(--muted);font-size:.74rem}
.entry .chev{color:var(--faint);flex:none}

/* Status note (replaces a chat log: one line at a time, above the composer) */
.note{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;font-size:.88rem;
  background:rgba(30,35,51,.92);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.note .msgtext{flex:1;min-width:0}
.note .ok{color:var(--good);font-weight:600}
.note button{flex:none;border:0;background:transparent;color:var(--ink);text-decoration:underline;padding:0;font-size:.82rem}
.note .close{text-decoration:none;color:var(--faint);font-size:.9rem}
.typing{display:flex;gap:5px;align-items:center;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue-2);animation:b 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{40%{transform:translateY(-4px);opacity:1}0%,80%,100%{opacity:.35}}

/* Composer */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:24px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,rgba(15,18,27,0),rgba(15,18,27,.94) 34%)}
.composer{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.halls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.halls::-webkit-scrollbar{display:none}
.halls.editing{flex-wrap:wrap;overflow:visible;touch-action:none}
.hall{flex:none;border:1px solid var(--edge);background:rgba(23,27,40,.8);border-radius:99px;padding:6px 13px;font-size:.8rem;font-weight:600;color:var(--muted);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);touch-action:pan-x;-webkit-user-select:none;user-select:none}
.hall[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 12px var(--glow)}
.editing .hall{animation:jig .28s ease-in-out infinite alternate;cursor:grab}
.editing .hall.drag{animation:none;transform:scale(1.08);box-shadow:0 8px 20px rgba(0,0,0,.5);border-color:var(--cyan);color:var(--ink);cursor:grabbing}
.hall.done{background:var(--ink);color:var(--bg);border-color:var(--ink);animation:none!important}
@keyframes jig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.hint{font-size:.74rem;color:var(--muted);text-align:center;margin-top:-4px}
.att{display:flex;align-items:center;gap:10px}
.att img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.att .meta{flex:1;min-width:0;font-size:.8rem;color:var(--muted)}
.att .meta b{color:var(--cyan);font-weight:600}
.att button{border:0;background:var(--panel-2);border-radius:99px;padding:4px 10px;font-size:.78rem}
.bar{display:flex;align-items:center;gap:12px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:56px;border-radius:28px;padding:0 6px 0 18px;
  background:rgba(30,35,51,.82);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.txt{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:0}
.txt::placeholder{color:var(--faint)}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center}
.send svg{width:18px;height:18px}
.stop{flex:none;border:0;background:rgba(255,255,255,.08);border-radius:99px;padding:9px 14px;font-weight:600;font-size:.85rem}
.cam{flex:none;width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 25%, #8cc0ff, var(--blue) 55%, #2a5bd6);
  box-shadow:0 0 0 6px rgba(61,123,255,.14),0 10px 30px var(--glow)}
.cam svg{width:32px;height:32px}
.cam:active{transform:scale(.96)}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(5,7,12,.62);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:100%;max-width:500px;max-height:calc(100% - 40px);overflow-y:auto;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;
  background:rgba(23,27,40,.96);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sheet h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
.sheet .where{font-size:.8rem;color:var(--muted);margin-top:-12px}
.names{display:flex;gap:6px;flex-wrap:wrap}
.name{border:1px solid var(--edge);background:transparent;border-radius:99px;padding:6px 13px;font-size:.82rem;font-weight:600;color:var(--muted)}
.name[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.ritems{display:flex;flex-direction:column;background:var(--panel-2);border-radius:16px;padding:2px 12px}
.ritem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem .nm{font-weight:500;min-width:0}
.ritem .sub{grid-column:1/2;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ritem .x{grid-column:2/3;justify-self:end;border:0;background:transparent;color:var(--faint);font-size:.76rem;padding:0}
.step{display:flex;align-items:center;border-radius:10px;background:rgba(255,255,255,.05);grid-row:1/2;grid-column:2/3}
.step button{border:0;background:transparent;width:30px;height:30px;font-size:1.05rem;color:var(--ink)}
.step span{min-width:44px;text-align:center;font-size:.86rem;font-variant-numeric:tabular-nums}
.empty{font-size:.84rem;color:var(--muted);padding:10px 0}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:.72rem;color:var(--muted);font-weight:600;min-width:0}
.fields input{width:100%;background:var(--panel-2);border:1px solid var(--edge);border-radius:12px;padding:10px 8px;font-size:1rem;font-family:var(--display);font-weight:600;text-align:center}
.fields.goals{grid-template-columns:1fr 1fr}
.fields.goals .wide{grid-column:1/-1}
.fields.goals input{text-align:left;padding:11px 12px}
.fine{font-size:.76rem;color:var(--muted)}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:12px;font-weight:600;background:var(--panel-2)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 6px 18px var(--glow)}
.btn.danger{flex:none;background:transparent;color:var(--bad);padding:12px 6px}
@media (max-width:380px){.fields{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){.typing i,.editing .hall{animation:none}.track i{transition:none}}
</style>

<div class="bg" aria-hidden="true"></div>
<main class="app">
  <div class="top">
    <div><h1>Today</h1><div class="sub" id="day"></div></div>
    <button class="iconbtn" id="openSettings" aria-label="Daily targets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>

  <section class="hero" aria-label="Today's macros">
    <div class="gauge">
      <svg viewBox="0 0 260 150" role="img" aria-labelledby="gaugeLabel">
        <title id="gaugeLabel">Calories today</title>
        <defs>
          <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2f62d9"/><stop offset=".6" stop-color="#5fa0ff"/><stop offset="1" stop-color="#8fd8ff"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path d="M20 135 A110 110 0 0 1 240 135" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="14" stroke-linecap="round"/>
        <path id="arc" d="M20 135 A110 110 0 0 1 240 135" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" filter="url(#glow)" style="transition:stroke-dashoffset .8s ease"/>
        <circle id="knob" cx="20" cy="135" r="8.5" fill="#ffffff" filter="url(#glow)" hidden/>
      </svg>
      <div class="center">
        <div class="kcal" id="kcal">0</div>
        <div class="of" id="kcalOf">calories</div>
        <div class="left" id="kcalLeft"></div>
      </div>
    </div>
    <div class="pro">
      <div class="head"><span class="lab">Protein</span><span class="val"><span id="proNum">0</span> <small id="proOf">g</small></span></div>
      <div class="track"><i id="proBar" style="width:0"></i></div>
    </div>
    <div class="minor">
      <span><i style="background:var(--carb)"></i><b id="carbNum">0</b><span id="carbOf"> g carbs</span></span>
      <span><i style="background:var(--fat)"></i><b id="fatNum">0</b><span id="fatOf"> g fat</span></span>
    </div>
  </section>

  <section class="log" id="log" hidden aria-label="Today's entries">
    <span class="lab">Today's entries</span>
    <div class="entries" id="entries"></div>
  </section>

</main>

<div class="dock">
  <form class="composer" id="form" autocomplete="off">
    <div class="note" id="note" role="status" aria-live="polite" hidden></div>
    <div class="halls" id="halls" role="group" aria-label="Where are you eating? Press and hold to reorder."></div>
    <div class="hint" id="reorderHint" hidden>Drag to reorder, then tap Done</div>
    <div class="att" id="att" hidden><img id="attImg" alt="Photo to send"><div class="meta" id="attMeta"></div><button type="button" id="attX">Remove</button></div>
    <div class="bar">
      <div class="field">
        <input class="txt" id="txt" placeholder="Add a note or describe it…" aria-label="Describe what you ate">
        <button type="submit" class="send" id="send" aria-label="Log it" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="stop" id="stop" hidden>Stop</button>
      </div>
      <button type="button" class="cam" id="camBtn" aria-label="Take a photo or scan a code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </form>
</div>

<!-- Review / edit an entry -->
<div class="scrim" id="review" hidden>
  <form class="sheet" id="reviewForm" role="dialog" aria-modal="true" aria-labelledby="rvTitle">
    <h2 id="rvTitle">Add to today</h2>
    <div class="where" id="rvWhere"></div>
    <div class="names" id="rvNames" role="group" aria-label="Name"></div>
    <div class="ritems" id="rvItems"></div>
    <div class="fields">
      <label>Calories<input type="number" inputmode="decimal" min="0" step="any" id="tk"></label>
      <label>Protein g<input type="number" inputmode="decimal" min="0" step="any" id="tp"></label>
      <label>Carbs g<input type="number" inputmode="decimal" min="0" step="any" id="tc"></label>
      <label>Fat g<input type="number" inputmode="decimal" min="0" step="any" id="tf"></label>
    </div>
    <div class="fine" id="rvFine">Change servings above, or type over any total.</div>
    <div class="actions">
      <button type="button" class="btn danger" id="rvDelete" hidden>Delete</button>
      <button type="button" class="btn" id="rvCancel">Cancel</button>
      <button type="submit" class="btn primary" id="rvSave">Add</button>
    </div>
  </form>
</div>

<!-- Targets -->
<div class="scrim" id="settings" hidden>
  <form class="sheet" id="goalForm" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Daily targets</h2>
    <div class="fields goals">
      <label class="wide">Calories<input type="number" inputmode="decimal" min="0" step="any" id="gk" placeholder="2200"></label>
      <label class="wide">Protein (g)<input type="number" inputmode="decimal" min="0" step="any" id="gp" placeholder="150"></label>
      <label>Carbs (g)<input type="number" inputmode="decimal" min="0" step="any" id="gc" placeholder="250"></label>
      <label>Fat (g)<input type="number" inputmode="decimal" min="0" step="any" id="gf" placeholder="70"></label>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="closeSettings">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</div>

<script>
const HALLS=[{id:1,name:'Rand'},{id:2,name:'Commons'},{id:3,name:'Kissam'},{id:11,name:'EBI'},{id:20,name:'Rothschild'},{id:21,name:'Carmichael'},{id:19,name:'Zeppos'},{id:0,name:'Elsewhere'}];
const NAMES=['Breakfast','Lunch','Dinner','Snack','Drink'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dstr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const r1=n=>Math.round((+n||0)*10)/10;
const fmt=n=>Math.round(+n||0).toLocaleString();
const timeName=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;return h>=5&&h<10.5?'Breakfast':h>=11&&h<14.5?'Lunch':h>=17&&h<21?'Dinner':'Snack'};

const state={date:dstr(),hall:LS.get('hall',1),menu:null,uid:null,logs:{},settings:null,photo:null,code:null,busy:false,turns:[],lastLogged:null,editing:false,draft:null};
let db=null,sample=null,ctl=null;

/* ---------- hall chips: tap to pick, press and hold to reorder ---------- */
function hallOrder(){
  const saved=LS.get('hallOrder',null);const ids=HALLS.map(h=>h.id);
  const order=Array.isArray(saved)?saved.filter(id=>ids.includes(id)):[];
  for(const id of ids)if(!order.includes(id))order.push(id);
  return order;
}
function renderHalls(){
  const box=$('#halls');box.classList.toggle('editing',state.editing);$('#reorderHint').hidden=!state.editing;
  box.innerHTML=hallOrder().map(id=>{const h=HALLS.find(x=>x.id===id);return `<button type="button" class="hall" data-h="${id}" aria-pressed="${id===state.hall}">${h.name}</button>`}).join('')
    +(state.editing?'<button type="button" class="hall done" id="doneReorder">Done</button>':'');
  if(!state.editing){const on=box.querySelector('[aria-pressed="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'})}
}
function hallName(id=state.hall){return (HALLS.find(h=>h.id===id)||{}).name}
(function setupHalls(){
  const box=$('#halls');let holdT=null,startX=0,startY=0,held=false,drag=null;
  box.addEventListener('contextmenu',e=>e.preventDefault());
  box.addEventListener('pointerdown',e=>{
    const chip=e.target.closest('[data-h]');if(!chip)return;
    startX=e.clientX;startY=e.clientY;held=false;
    if(state.editing){drag=chip;chip.classList.add('drag');try{chip.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault();return}
    clearTimeout(holdT);
    holdT=setTimeout(()=>{held=true;state.editing=true;renderHalls();if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}},450);
  });
  box.addEventListener('pointermove',e=>{
    if(holdT&&!state.editing&&Math.hypot(e.clientX-startX,e.clientY-startY)>8){clearTimeout(holdT);holdT=null}
    if(!drag)return;e.preventDefault();
    const el=document.elementFromPoint(e.clientX,e.clientY);const over=el&&el.closest('[data-h]');
    if(over&&over!==drag&&over.parentElement===box){
      const r=over.getBoundingClientRect();const after=(e.clientX>r.left+r.width/2)||(e.clientY>r.bottom);
      box.insertBefore(drag,after?over.nextSibling:over);
    }
  });
  const end=()=>{clearTimeout(holdT);holdT=null;if(drag){drag.classList.remove('drag');drag=null;LS.set('hallOrder',[...box.querySelectorAll('[data-h]')].map(b=>+b.dataset.h))}};
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  box.addEventListener('click',e=>{
    if(e.target.id==='doneReorder'){state.editing=false;renderHalls();return}
    if(held||state.editing){held=false;return}
    const b=e.target.closest('[data-h]');if(!b)return;
    state.hall=+b.dataset.h;LS.set('hall',state.hall);renderHalls();watchMenu();
  });
})();
function renderDay(){$('#day').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}

/* ---------- menu ---------- */
let unsubMenu=null;
function watchMenu(){
  if(unsubMenu){unsubMenu();unsubMenu=null}
  state.menu=null;if(!db||!state.hall)return;
  unsubMenu=db.doc(`menus/${state.date}__${state.hall}`).onSnapshot(s=>{state.menu=s.exists?s.data():null},()=>{state.menu=null});
}
function menuList(){if(!state.menu)return[];const out=[];let i=0;for(const m of state.menu.meals)for(const it of m.items)out.push({...it,meal:m.meal,id:'i'+(i++)});return out}

/* ---------- today ---------- */
const logId=()=>'log-'+state.date;
function entries(){return ((state.logs[logId()]||{}).entries)||[]}
function dayTot(){return entries().reduce((t,e)=>({k:t.k+e.tot.k,p:t.p+e.tot.p,c:t.c+e.tot.c,f:t.f+e.tot.f}),{k:0,p:0,c:0,f:0})}
function goals(){return (state.settings&&state.settings.goals)||{}}
const ICONS={
  Breakfast:'<path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4"/><path d="M6 16a6 6 0 0 1 12 0"/><path d="M3 19h18"/>',
  Lunch:'<circle cx="12" cy="12" r="7"/><path d="M12 8v4l2.5 2"/>',
  Dinner:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  Snack:'<path d="M7 4h10l-1 16H8z"/><path d="M7.5 9h9"/>',
  Drink:'<path d="M6 4h12l-1.5 16h-9z"/><path d="M6.5 9h11"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.Snack}</svg>`;
// Older entries stored a longer title in `meal` ("Lunch at Rand"); pull the short name out of it.
function entryName(e){if(NAMES.includes(e.name))return e.name;const m=String(e.meal||'').toLowerCase();return NAMES.find(n=>m.includes(n.toLowerCase()))||'Snack'}
function renderToday(){
  const t=dayTot(),G=goals();
  const pct=G.k?Math.min(1,t.k/G.k):0;
  $('#arc').setAttribute('stroke-dashoffset',String(100-pct*100));
  const a=Math.PI*(1-pct),x=130+110*Math.cos(a),y=135-110*Math.sin(a);
  const knob=$('#knob');knob.setAttribute('cx',x.toFixed(1));knob.setAttribute('cy',y.toFixed(1));knob.toggleAttribute('hidden',!(G.k&&t.k>0));
  $('#kcal').textContent=fmt(t.k);
  $('#kcalOf').textContent=G.k?`of ${fmt(G.k)} calories`:'calories';
  const left=$('#kcalLeft');left.classList.toggle('over',!!G.k&&t.k>G.k);
  left.textContent=G.k?(t.k<=G.k?`${fmt(G.k-t.k)} left`:`${fmt(t.k-G.k)} over`):'';
  $('#proNum').textContent=fmt(t.p);$('#proOf').textContent=G.p?`/ ${fmt(G.p)} g`:'g';
  $('#proBar').style.width=(G.p?Math.min(100,t.p/G.p*100):0)+'%';
  $('#carbNum').textContent=fmt(t.c);$('#carbOf').textContent=G.c?` / ${fmt(G.c)} g carbs`:' g carbs';
  $('#fatNum').textContent=fmt(t.f);$('#fatOf').textContent=G.f?` / ${fmt(G.f)} g fat`:' g fat';
  const es=entries().slice().sort((a,b)=>a.t<b.t?-1:1);
  $('#log').hidden=!es.length;
  $('#entries').innerHTML=es.map(e=>{const n=entryName(e);return `<button type="button" class="entry" data-edit="${esc(e.id)}">
    <span class="ic">${icon(n)}</span>
    <span class="t"><b>${esc(n)}</b><small>${new Date(e.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${e.hall?' · '+esc(e.hall):''} · ${esc(e.items.map(i=>i.n).join(', '))}</small></span>
    <span class="n"><b>${fmt(e.tot.k)}</b><small>${fmt(e.tot.p)} g protein</small></span>
    <svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg></button>`}).join('');
}
$('#entries').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(!b)return;const en=entries().find(x=>x.id===b.dataset.edit);if(en)openReview({mode:'edit',entry:en})});

/* ---------- review / edit sheet ---------- */
function itemsTot(items){return items.reduce((t,i)=>({k:t.k+i.k*i.sv,p:t.p+i.p*i.sv,c:t.c+i.c*i.sv,f:t.f+i.f*i.sv}),{k:0,p:0,c:0,f:0})}
function openReview({mode,entry,meal,replaceId,bubble}){
  const src=mode==='edit'?entry:meal;
  state.draft={mode,id:mode==='edit'?entry.id:null,replaceId:replaceId||null,bubble:bubble||null,
    name:entryName(src),hall:src.hall||'',t:mode==='edit'?entry.t:null,
    items:src.items.map(i=>({...i})),tot:{...src.tot},manual:!!(mode==='edit'&&entry.manual)};
  $('#rvTitle').textContent=mode==='edit'?'Edit entry':replaceId?'Update entry':'Add to today';
  $('#rvSave').textContent=mode==='edit'||replaceId?'Save':'Add';
  $('#rvDelete').hidden=mode!=='edit';$('#rvDelete').dataset.armed='';$('#rvDelete').textContent='Delete';
  $('#rvWhere').textContent=[src.hall,mode==='edit'?new Date(entry.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''].filter(Boolean).join(' · ');
  renderReview(true);$('#review').hidden=false;
}
function renderReview(fillTotals){
  const D=state.draft;
  $('#rvNames').innerHTML=NAMES.map(n=>`<button type="button" class="name" data-n="${n}" aria-pressed="${n===D.name}">${n}</button>`).join('');
  $('#rvItems').innerHTML=D.items.length?D.items.map((i,ix)=>`<div class="ritem">
      <span class="nm">${esc(i.n)}</span>
      <span class="step" role="group" aria-label="Servings of ${esc(i.n)}"><button type="button" data-dec="${ix}" aria-label="Less">−</button><span>${i.sv}×</span><button type="button" data-inc="${ix}" aria-label="More">+</button></span>
      <span class="sub">${fmt(i.k*i.sv)} cal · ${r1(i.p*i.sv)} g protein${i.v&&i.v!=='estimate'?' · '+esc(i.v):''}</span>
      <button type="button" class="x" data-x="${ix}">Remove</button></div>`).join('')
    :'<div class="empty">No items. Type the totals below.</div>';
  if(fillTotals){const T=D.manual?D.tot:itemsTot(D.items);for(const k of ['k','p','c','f'])$('#t'+k).value=k==='k'?Math.round(T[k]):r1(T[k])}
}
$('#rvNames').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;state.draft.name=b.dataset.n;renderReview(false)});
$('#rvItems').addEventListener('click',e=>{
  const D=state.draft,t=e.target;let i;
  if(t.dataset.inc!=null){i=D.items[+t.dataset.inc];i.sv=Math.round((i.sv+(i.sv<1?0.25:0.5))*4)/4}
  else if(t.dataset.dec!=null){i=D.items[+t.dataset.dec];i.sv=Math.max(0.25,Math.round((i.sv-(i.sv<=1?0.25:0.5))*4)/4)}
  else if(t.dataset.x!=null){D.items.splice(+t.dataset.x,1)}
  else return;
  D.manual=false;renderReview(true);
});
for(const k of ['k','p','c','f'])$('#t'+k).addEventListener('input',()=>{state.draft.manual=true});
function closeReview(){$('#review').hidden=true;state.draft=null}
$('#rvCancel').addEventListener('click',()=>{const D=state.draft;if(D&&D.mode==='new')note('Not logged.');closeReview()});
$('#review').addEventListener('click',e=>{if(e.target.id==='review')$('#rvCancel').click()});
$('#rvDelete').addEventListener('click',async()=>{const D=state.draft;if(!D)return;if($('#rvDelete').dataset.armed!=='1'){$('#rvDelete').dataset.armed='1';$('#rvDelete').textContent='Tap to confirm';return}
  $('#rvDelete').dataset.armed='';$('#rvDelete').textContent='Delete';closeReview();await removeEntry(D.id)});
$('#reviewForm').addEventListener('submit',async e=>{
  e.preventDefault();const D=state.draft;if(!D)return;
  const tot={k:Math.max(0,r1($('#tk').value)),p:Math.max(0,r1($('#tp').value)),c:Math.max(0,r1($('#tc').value)),f:Math.max(0,r1($('#tf').value))};
  const entry={id:D.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:D.t||new Date().toISOString(),name:D.name,hall:D.hall,items:D.items,tot,manual:!!D.manual};
  const replace=D.mode==='edit'?D.id:D.replaceId;
  closeReview();
  try{
    await upsertEntry(entry,replace);
    if(D.mode==='new'){state.lastLogged=entry.id;note(`<span class="ok">${replace?'Updated':'Logged'} ${esc(entry.name)} · ${fmt(tot.k)} cal</span>`,{html:true,undo:replace?null:entry.id})}
    else note(`<span class="ok">Saved ${esc(entry.name)}</span>`,{html:true});
  }catch(err){sys(err&&err.code==='no_store'?'Not saved: open this page in Claude while signed in.':"Couldn't save. Try again.")}
});

/* ---------- settings ---------- */
function openSettings(){const G=goals();for(const k of ['k','p','c','f'])$('#g'+k).value=G[k]||'';$('#settings').hidden=false;setTimeout(()=>$('#gk').focus(),50)}
function closeSettings(){$('#settings').hidden=true}
$('#openSettings').addEventListener('click',openSettings);
$('#closeSettings').addEventListener('click',closeSettings);
$('#settings').addEventListener('click',e=>{if(e.target.id==='settings')closeSettings()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#settings').hidden)closeSettings();else if(!$('#review').hidden)$('#rvCancel').click()});
$('#goalForm').addEventListener('submit',async e=>{
  e.preventDefault();const g={};for(const k of ['k','p','c','f']){const v=r1($('#g'+k).value);if(v>0)g[k]=v}
  try{await saveGoals(g);closeSettings()}catch(err){closeSettings();sys(err&&err.code==='no_store'?'Targets save when this page is open in Claude.':"Couldn't save targets. Try again.")}
});

/* ---------- storage ---------- */
let chain=Promise.resolve();
const queue=fn=>{const p=chain.then(fn);chain=p.catch(()=>{});return p};
const col=()=>db&&state.uid?db.collection('data/users/'+state.uid):null;
function writeEntries(list){const c=col();if(!c)return Promise.reject({code:'no_store'});return queue(()=>c.doc(logId()).set({date:state.date,entries:list}))}
async function upsertEntry(entry,replaceId){
  const list=entries().slice();const ix=replaceId?list.findIndex(e=>e.id===replaceId):-1;
  if(ix>=0)list[ix]={...entry,t:list[ix].t};else list.push(entry);
  await writeEntries(list);
}
async function removeEntry(id){try{await writeEntries(entries().filter(e=>e.id!==id))}catch(e){sys("Couldn't remove that. Try again.")}}
async function saveGoals(g){const c=col();if(!c)throw {code:'no_store'};await queue(()=>c.doc('settings').set({...(state.settings||{}),goals:g}))}

/* ---------- photo, QR & barcodes ---------- */
const CAM_ICON=$('#camBtn').innerHTML;
const SEND_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
$('#camBtn').addEventListener('click',()=>{if(state.busy)return;if(state.photo)$('#form').requestSubmit();else $('#file').click()});
let zx=null;
function loadZXing(){
  if(zx)return zx;
  zx=new Promise(res=>{if(window.ZXing)return res(window.ZXing);const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=()=>res(window.ZXing||null);s.onerror=()=>res(null);document.head.append(s)});
  return zx;
}
async function readCode(file,url){
  try{if('BarcodeDetector' in window){const bmp=await createImageBitmap(file);const found=await new BarcodeDetector().detect(bmp);if(found&&found.length)return {text:found[0].rawValue,format:found[0].format}}}catch(e){}
  try{const Z=await loadZXing();if(!Z)return null;const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const r=await new Z.BrowserMultiFormatReader(hints).decodeFromImageUrl(url);if(r)return {text:r.getText(),format:String(Z.BarcodeFormat[r.getBarcodeFormat()]||'')}}catch(e){}
  return null;
}
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  state.photo=f;state.code=null;const url=URL.createObjectURL(f);
  $('#attImg').src=url;$('#att').hidden=false;$('#attMeta').textContent='Checking for a QR code or barcode…';updateSend();
  const code=await readCode(f,url);if(state.photo!==f)return;
  state.code=code;
  $('#attMeta').innerHTML=code?`Scanned ${esc(/qr/i.test(code.format)?'QR code':'barcode')}: <b>${esc(code.text.length>40?code.text.slice(0,40)+'…':code.text)}</b>`:'Photo ready. Tap → to log it.';
});
$('#attX').addEventListener('click',()=>{state.photo=null;state.code=null;$('#att').hidden=true;updateSend()});
$('#txt').addEventListener('input',updateSend);
function updateSend(){
  const ready=!!state.photo||!!$('#txt').value.trim();
  $('#send').hidden=state.busy||!ready||!!state.photo;$('#stop').hidden=!state.busy;
  const cam=$('#camBtn');const sendMode=!!state.photo&&!state.busy;
  if(cam.dataset.mode!==(sendMode?'send':'cam')){cam.dataset.mode=sendMode?'send':'cam';cam.innerHTML=sendMode?SEND_ICON:CAM_ICON;cam.setAttribute('aria-label',sendMode?'Log it':'Take a photo or scan a code')}
}

/* ---------- status note: one line above the composer, no running log ---------- */
let noteT=null;
function note(content,{html=false,undo=null,sticky=false}={}){
  const el=$('#note');clearTimeout(noteT);
  el.innerHTML=`<span class="msgtext">${html?content:esc(content)}</span>${undo?`<button type="button" data-undo="${esc(undo)}">Undo</button>`:''}${sticky?'':'<button type="button" class="close" aria-label="Dismiss">✕</button>'}`;
  el.hidden=false;
  if(!sticky)noteT=setTimeout(()=>{el.hidden=true},undo?7000:9000);
}
function hideNote(){clearTimeout(noteT);$('#note').hidden=true}
function sys(t){note(t)}
$('#note').addEventListener('click',async e=>{
  if(e.target.closest('.close')){hideNote();return}
  const u=e.target.closest('[data-undo]');
  if(u){const id=u.dataset.undo;await removeEntry(id);if(state.lastLogged===id)state.lastLogged=null;note('Removed.')}
});

/* ---------- Claude ---------- */
function instructions(){
  const items=menuList();const t=dayTot();
  const where=state.hall&&items.length?`They're at ${hallName()} dining hall. Its menu for today, from the official NetNutrition data (id | meal | station | item | one serving | kcal per serving):\n`+
    items.map(c=>`${c.id} | ${c.meal} | ${c.s||''} | ${c.n} | ${c.v}${c.g?` (${c.g}g)`:''} | ${Math.round(c.k)}`).join('\n')
    :state.hall?`They picked ${hallName()} dining hall, but its menu isn't loaded today.`:`They're not eating at a dining hall right now.`;
  return `You are the food logger inside Plate Log, a Vanderbilt student's personal macro tracker. Today is ${state.date}, local time ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.
The student tells you what they ate with a photo, a text message, or both. A photo may show a plate, a package, a nutrition label, or a QR code or barcode; the page decodes codes and tells you what it read. Work out what they ate and how much. They review and adjust your numbers before anything is logged.

${where}

How to estimate:
- Dining-hall food: match each food to the menu item it most likely is and give menu_id plus servings (decimals like 0.5, 1.5), judging the amount against the serving size and grams. Use the plate (about 10 in), bowls, cups and utensils for scale. Include visible sauces, dressings, toppings and drinks.
- A nutrition label in the photo: use its numbers exactly, times the servings they ate (assume 1 unless told).
- A barcode or QR code: use the product name and label visible in the photo. If you recognise the product from the code or packaging, use its usual label values. If you can't tell what the product is, say so in reply, ask them to type the product name, and set meal to null.
- Anything else (snacks, packaged food, takeout, drinks, home food): set menu_id null, servings 1, and give calories, protein_g, carbs_g and fat_g as TOTALS for the amount eaten, using typical nutrition-label values.
- If their message corrects or adds to the food in your previous reply ("actually two bags", "I also had a Coke with that"), return the full updated meal with "replaces_last": true.
- If they only ask a question or chat, answer it and set meal to null.
- name is one of Breakfast, Lunch, Dinner, Snack, Drink. Use the time of day for full meals; small items between meals are Snack; a drink on its own is Drink.
So far today: ${Math.round(t.k)} kcal, ${Math.round(t.p)} g protein.

Reply with only JSON:
{"reply":"one short, friendly sentence","meal":{"name":"Lunch","items":[{"menu_id":"i12","label":"Al Pastor","servings":1.5},{"menu_id":null,"label":"Cheez-It, small handful","servings":1,"calories":75,"protein_g":1.5,"carbs_g":8.5,"fat_g":4}],"replaces_last":false}}
meal may be null. Labels are short food names.`;
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();if(state.busy)return;
  const text=$('#txt').value.trim();const photo=state.photo;const code=state.code;if(!text&&!photo)return;
  if(!sample){sys('Open this page in the Claude app or on claude.ai to log food.');return}
  rollDay();
  $('#txt').value='';state.photo=null;state.code=null;$('#att').hidden=true;
  const userTurn=(photo?'[Photo attached] ':'')+(code?`[The page decoded a ${code.format||'code'} in the photo: "${code.text}"] `:'')+(text||'Photo only. Log what is in it.');
  note('<span class="typing"><i></i><i></i><i></i></span>',{html:true,sticky:true});
  state.busy=true;updateSend();
  ctl=new AbortController();const items=menuList();
  try{
    const turns=[{role:'user',content:instructions()},...state.turns.slice(-10),{role:'user',content:userTurn}];
    const res=await sample.json(turns,{images:photo?[photo]:undefined,signal:ctl.signal,cache:false});
    const reply=String((res&&res.reply)||'Here is what I found.');
    let meal=null;
    if(res&&res.meal&&Array.isArray(res.meal.items)&&res.meal.items.length){
      const its=res.meal.items.map(it=>{
        const c=it.menu_id?items.find(x=>x.id===String(it.menu_id)):null;
        if(c)return {n:c.n,v:c.v||'',sv:Math.max(0.25,Math.round((+it.servings||1)*4)/4),k:r1(c.k),p:r1(c.p),c:r1(c.c),f:r1(c.f)};
        return {n:String(it.label||'Food'),v:'estimate',sv:1,k:r1(it.calories),p:r1(it.protein_g),c:r1(it.carbs_g),f:r1(it.fat_g)};
      });
      const T=itemsTot(its);
      meal={name:NAMES.includes(res.meal.name)?res.meal.name:timeName(),hall:state.hall?hallName():'',items:its,tot:{k:Math.round(T.k),p:r1(T.p),c:r1(T.c),f:r1(T.f)}};
    }
    if(meal)hideNote();else note(reply);
    state.turns.push({role:'user',content:userTurn});
    state.turns.push({role:'assistant',content:JSON.stringify({reply,meal:meal&&{name:meal.name,items:meal.items.map(i=>({label:i.n,servings:i.sv,calories:Math.round(i.k*i.sv),protein_g:r1(i.p*i.sv)}))}})});
    if(meal){
      const replaceId=res.meal.replaces_last&&state.lastLogged&&entries().some(x=>x.id===state.lastLogged)?state.lastLogged:null;
      openReview({mode:'new',meal,replaceId});
    }
  }catch(err){if(err&&err.code==='cancelled')hideNote();else sys(errCopy(err&&err.code))}
  finally{state.busy=false;updateSend()}
});
$('#stop').addEventListener('click',()=>ctl&&ctl.abort());
function errCopy(code){
  return ({not_granted:"Claude isn't allowed on this page yet. Allow it from the page's Permissions menu.",
    sampling_disabled:"Claude isn't available on this account right now.",
    rate_limited:"You've hit a usage limit. Try again in a bit.",
    image_rejected:"That photo couldn't be read. Try a JPEG or PNG.",
    images_unavailable:"Photos can't be sent from this view. Try the Claude app or claude.ai.",
    invalid_json:"That answer came back garbled. Send it again.",
    refused:"Claude couldn't help with that one. Try describing the food.",
    session_expired:"Sign in to Claude again, then retry."}[code])||"Couldn't reach Claude. Send it again.";
}

/* ---------- day rollover ---------- */
function rollDay(){const d=dstr();if(d!==state.date){state.date=d;state.lastLogged=null;state.turns=[];renderDay();watchMenu();renderToday()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollDay()});

/* ---------- boot ---------- */
renderDay();renderHalls();renderToday();
(async()=>{
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [d,s,u]=await Promise.all([use('db'),use('sample'),use('user')]);
  db=d;sample=s;
  if(!sample||!db)sys('Open this page in the Claude app or on claude.ai to log food.');
  watchMenu();
  if(u&&db){try{state.uid=await u.id()}catch(e){state.uid=null}}
  if(state.uid){
    col().onSnapshot(snap=>{
      state.logs={};state.settings=null;
      for(const doc of snap.docs){if(doc.id==='settings')state.settings=doc.data();else if(doc.id.startsWith('log-'))state.logs[doc.id]=doc.data()}
      renderToday();
    },()=>{});
  }
})();
</script>

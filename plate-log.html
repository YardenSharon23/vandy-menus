<title>Plate Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one navy column. Calorie gauge + protein bar on top, today's meals, the chat thread, and a pinned composer where you pick the hall, add a photo and type. */
:root{
  color-scheme:dark;
  --bg:#10131d; --panel:#181c2a; --panel-2:#1f2436; --edge:rgba(255,255,255,.07); --edge-hi:rgba(255,255,255,.13);
  --ink:#f1f4fb; --muted:#8c93a8; --faint:#5b6276;
  --blue:#3d7bff; --blue-2:#5fa0ff; --cyan:#8fd8ff; --glow:rgba(77,140,255,.55);
  --good:#3ddc84; --bad:#ff5b6b;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --blur:blur(20px) saturate(140%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(34rem 26rem at 100% -6%, rgba(61,123,255,.26), transparent 62%),
             radial-gradient(28rem 24rem at -10% 40%, rgba(143,216,255,.12), transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
.glass{background:rgba(24,28,42,.72);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-block:18px 172px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.01em}
.top .sub{font-size:.82rem;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--edge-hi);background:var(--panel-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

/* Gauge */
.hero{border-radius:24px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:18px;background:linear-gradient(180deg,var(--panel),#151927)}
.gauge{position:relative;width:100%;max-width:340px;margin:0 auto}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge .center{position:absolute;left:0;right:0;bottom:4%;text-align:center;display:flex;flex-direction:column;align-items:center}
.gauge .kcal{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,13vw,3.4rem);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.gauge .of{font-size:.85rem;color:var(--muted);margin-top:6px}
.gauge .left{font-size:.8rem;font-weight:600;margin-top:2px;color:var(--cyan)}
.gauge .left.over{color:var(--bad)}
.ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint);padding:0 4%;margin-top:-2px}

.pro .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lab{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pro .val{font-family:var(--display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pro .val span{color:var(--muted);font-size:.85rem;font-weight:500}
.track{height:12px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:8px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-2) 70%,var(--cyan));
  box-shadow:0 0 14px var(--glow);transition:width .6s ease}
.pro .note{font-size:.78rem;color:var(--muted);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel-2);border:1px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
.tile b span{color:var(--muted);font-size:.8rem;font-weight:500}
.tile .track{height:5px;margin-top:7px}
.tile .track i{box-shadow:none;background:var(--blue-2)}

/* Meals */
.meals{display:flex;flex-direction:column;gap:8px}
.meal{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:11px 14px}
.meal .t{flex:1;min-width:0}
.meal .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .t small{color:var(--muted);font-size:.78rem}
.meal .n{text-align:right;font-variant-numeric:tabular-nums}
.meal .n b{font-family:var(--display);font-weight:600}
.meal .n small{display:block;color:var(--muted);font-size:.78rem}
.rm{border:0;background:transparent;color:var(--faint);padding:4px;font-size:.85rem}
.rm.armed{color:var(--bad);font-size:.78rem;font-weight:600}

/* Thread */
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--blue),#2f62d9);border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--edge);border-bottom-left-radius:6px}
.msg img{border-radius:12px;max-height:220px;width:auto;max-width:100%;object-fit:cover}
.card{border-radius:12px;background:var(--panel-2);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.card .row{display:flex;justify-content:space-between;gap:10px}
.card .row span:first-child{min-width:0}
.card .row span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.card .tot{border-top:1px solid var(--edge-hi);padding-top:6px;margin-top:2px;font-weight:600}
.card .tot span:last-child{color:var(--cyan)}
.state{font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:center}
.state .ok{color:var(--good)}
.state button{border:0;background:transparent;color:var(--ink);text-decoration:underline;padding:0;font-size:.8rem}
.typing{display:flex;gap:5px;align-items:center;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue-2);animation:b 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{40%{transform:translateY(-4px);opacity:1}0%,80%,100%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.typing i{animation:none}.track i{transition:none}}

/* Composer */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,transparent,rgba(16,19,29,.92) 40%)}
.composer{max-width:520px;margin:0 auto;border-radius:24px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.where{display:flex;align-items:center;gap:8px;min-width:0}
.where .lab{flex:none}
.halls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:1px}
.halls::-webkit-scrollbar{display:none}
.hall{flex:none;border:1px solid var(--edge-hi);background:transparent;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:600;color:var(--muted)}
.hall[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 12px var(--glow)}
.att{display:flex;align-items:center;gap:10px}
.att img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.att button{border:0;background:var(--panel-2);border-radius:99px;padding:4px 10px;font-size:.8rem}
.bar{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:18px;padding:5px}
.cam{flex:none;width:48px;height:48px;border-radius:14px;border:0;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--blue-2),var(--blue));box-shadow:0 6px 18px var(--glow)}
.cam svg{width:23px;height:23px}
.txt{flex:1;min-width:0;border:0;background:transparent;padding:10px 4px;outline:none}
.txt::placeholder{color:var(--faint)}
.send{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center}
.send:disabled{background:rgba(255,255,255,.06);color:var(--faint);cursor:default}
.send svg{width:18px;height:18px}
.stop{flex:none;border:0;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;font-weight:600}

/* Settings sheet */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(5,7,12,.6);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:100%;max-width:520px;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;background:rgba(24,28,42,.92)}
.sheet h2{font-family:var(--display);font-size:1.15rem;margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600}
.fields input{width:100%;background:var(--panel-2);border:1px solid var(--edge-hi);border-radius:12px;padding:11px 12px;font-size:1.05rem;font-family:var(--display);font-weight:600;color:var(--ink)}
.fields .big{grid-column:1/-1}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:12px;font-weight:600;background:var(--panel-2)}
.btn.primary{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 6px 18px var(--glow)}
.sheet .fine{font-size:.78rem;color:var(--muted)}
</style>

<div class="bg" aria-hidden="true"></div>
<main class="app">
  <div class="top">
    <div><h1>Today</h1><div class="sub" id="day"></div></div>
    <button class="iconbtn" id="openSettings" aria-label="Settings: target macros">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>

  <section class="hero" aria-label="Today's macros">
    <div>
      <div class="gauge">
        <svg viewBox="0 0 260 150" role="img" aria-labelledby="gaugeLabel">
          <title id="gaugeLabel">Calories today</title>
          <defs>
            <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2f62d9"/><stop offset=".6" stop-color="#5fa0ff"/><stop offset="1" stop-color="#8fd8ff"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path d="M20 135 A110 110 0 0 1 240 135" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16" stroke-linecap="round"/>
          <path id="arc" d="M20 135 A110 110 0 0 1 240 135" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" filter="url(#glow)" style="transition:stroke-dashoffset .8s ease"/>
          <circle id="knob" cx="20" cy="135" r="9" fill="#ffffff" filter="url(#glow)" hidden/>
        </svg>
        <div class="center">
          <div class="kcal" id="kcal">0</div>
          <div class="of" id="kcalOf">calories</div>
          <div class="left" id="kcalLeft"></div>
        </div>
      </div>
      <div class="ends"><span>0</span><span id="endGoal"></span></div>
    </div>

    <div class="pro">
      <div class="head"><span class="lab">Protein</span><span class="val"><span id="proNum">0</span> <span id="proOf">g</span></span></div>
      <div class="track"><i id="proBar" style="width:0"></i></div>
      <div class="note" id="proNote"></div>
    </div>

    <div class="tiles">
      <div class="tile"><span class="lab">Carbs</span><b><span id="carbNum" style="color:var(--ink);font-size:1.1rem;font-weight:600">0</span> <span id="carbOf">g</span></b><div class="track" id="carbTrack" hidden><i id="carbBar"></i></div></div>
      <div class="tile"><span class="lab">Fat</span><b><span id="fatNum" style="color:var(--ink);font-size:1.1rem;font-weight:600">0</span> <span id="fatOf">g</span></b><div class="track" id="fatTrack" hidden><i id="fatBar"></i></div></div>
    </div>
  </section>

  <section class="meals" id="meals" aria-label="Logged today"></section>
  <section class="thread" id="thread" aria-live="polite"></section>
</main>

<div class="dock">
  <form class="composer glass" id="form" autocomplete="off">
    <div class="where">
      <span class="lab">At</span>
      <div class="halls" id="halls" role="group" aria-label="Where are you eating?"></div>
    </div>
    <div class="att" id="att" hidden><img id="attImg" alt="Photo to send"><button type="button" id="attX">Remove photo</button></div>
    <div class="bar">
      <button type="button" class="cam" id="camBtn" aria-label="Take or upload a photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <input class="txt" id="txt" placeholder="Photo, words, or both…" aria-label="Describe what you ate">
      <button type="submit" class="send" id="send" aria-label="Log it" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="stop" id="stop" hidden>Stop</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </form>
</div>

<div class="scrim" id="settings" hidden>
  <form class="sheet glass" id="goalForm" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <h2 id="setTitle">Daily targets</h2>
    <div class="fields">
      <label class="big">Calories<input type="number" inputmode="numeric" min="0" id="gk" placeholder="2200"></label>
      <label class="big">Protein (g)<input type="number" inputmode="numeric" min="0" id="gp" placeholder="150"></label>
      <label>Carbs (g)<input type="number" inputmode="numeric" min="0" id="gc" placeholder="250"></label>
      <label>Fat (g)<input type="number" inputmode="numeric" min="0" id="gf" placeholder="70"></label>
    </div>
    <div class="fine">Leave a box empty to skip that target.</div>
    <div class="actions">
      <button type="button" class="btn" id="closeSettings">Cancel</button>
      <button type="submit" class="btn primary">Save targets</button>
    </div>
  </form>
</div>

<script>
const HALLS=[{id:1,name:'Rand'},{id:2,name:'Commons'},{id:3,name:'Kissam'},{id:11,name:'EBI'},{id:20,name:'Rothschild'},{id:21,name:'Carmichael'},{id:19,name:'Zeppos'},{id:0,name:'Elsewhere'}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dstr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const r1=n=>Math.round((+n||0)*10)/10;
const fmt=n=>Math.round(+n||0).toLocaleString();

const state={date:dstr(),hall:LS.get('hall',1),menu:null,uid:null,logs:{},settings:null,photo:null,busy:false,turns:[],lastLogged:null};
let db=null,sample=null,ctl=null,armed=null;

/* ---------- hall chips (in the composer) ---------- */
function renderHalls(){
  $('#halls').innerHTML=HALLS.map(h=>`<button type="button" class="hall" data-h="${h.id}" aria-pressed="${h.id===state.hall}">${h.name}</button>`).join('');
  const on=$('#halls [aria-pressed="true"]');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
}
$('#halls').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;state.hall=+b.dataset.h;LS.set('hall',state.hall);renderHalls();watchMenu()});
function hallName(){return (HALLS.find(h=>h.id===state.hall)||{}).name}
function renderDay(){$('#day').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}

/* ---------- menu ---------- */
let unsubMenu=null;
function watchMenu(){
  if(unsubMenu){unsubMenu();unsubMenu=null}
  state.menu=null;if(!db||!state.hall)return;
  unsubMenu=db.doc(`menus/${state.date}__${state.hall}`).onSnapshot(s=>{state.menu=s.exists?s.data():null},()=>{state.menu=null});
}
function menuList(){if(!state.menu)return[];const out=[];let i=0;for(const m of state.menu.meals)for(const it of m.items)out.push({...it,meal:m.meal,id:'i'+(i++)});return out}

/* ---------- today ---------- */
const logId=()=>'log-'+state.date;
function entries(){return ((state.logs[logId()]||{}).entries)||[]}
function dayTot(){return entries().reduce((t,e)=>({k:t.k+e.tot.k,p:t.p+e.tot.p,c:t.c+e.tot.c,f:t.f+e.tot.f}),{k:0,p:0,c:0,f:0})}
function goals(){return (state.settings&&state.settings.goals)||{}}
function renderToday(){
  const t=dayTot(),G=goals();
  // gauge
  const pct=G.k?Math.min(1,t.k/G.k):0;
  $('#arc').setAttribute('stroke-dashoffset',String(100-pct*100));
  const a=Math.PI*(1-pct),x=130+110*Math.cos(a),y=135-110*Math.sin(a);
  const knob=$('#knob');knob.setAttribute('cx',x.toFixed(1));knob.setAttribute('cy',y.toFixed(1));knob.toggleAttribute('hidden',!(G.k&&t.k>0));
  $('#kcal').textContent=fmt(t.k);
  $('#kcalOf').textContent=G.k?`of ${fmt(G.k)} calories`:'calories';
  const left=$('#kcalLeft');left.classList.toggle('over',!!G.k&&t.k>G.k);
  left.textContent=G.k?(t.k<=G.k?`${fmt(G.k-t.k)} left`:`${fmt(t.k-G.k)} over`):'Set a target in settings';
  $('#endGoal').textContent=G.k?fmt(G.k):'';
  // protein
  $('#proNum').textContent=fmt(t.p);$('#proOf').textContent=G.p?`/ ${fmt(G.p)} g`:'g';
  $('#proBar').style.width=(G.p?Math.min(100,t.p/G.p*100):0)+'%';
  $('#proNote').textContent=G.p?(t.p<G.p?`${fmt(G.p-t.p)} g to go`:'Protein target hit'):'';
  // carbs & fat
  for(const [k,key] of [['c','carb'],['f','fat']]){
    $('#'+key+'Num').textContent=fmt(t[k]);$('#'+key+'Of').textContent=G[k]?`/ ${fmt(G[k])} g`:'g';
    $('#'+key+'Track').hidden=!G[k];if(G[k])$('#'+key+'Bar').style.width=Math.min(100,t[k]/G[k]*100)+'%';
  }
  // meals
  $('#meals').innerHTML=entries().slice().reverse().map(e=>`<div class="meal">
    <div class="t"><b>${esc(e.meal||'Food')}</b><small>${new Date(e.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${e.hall?' · '+esc(e.hall):''}</small></div>
    <div class="n"><b>${fmt(e.tot.k)}</b><small>${fmt(e.tot.p)} g protein</small></div>
    <button class="rm${armed===e.id?' armed':''}" data-rm="${esc(e.id)}" aria-label="Remove ${esc(e.meal||'entry')}">${armed===e.id?'Remove?':'✕'}</button></div>`).join('');
}
$('#meals').addEventListener('click',async e=>{
  const b=e.target.closest('[data-rm]');if(!b)return;const id=b.dataset.rm;
  if(armed!==id){armed=id;renderToday();setTimeout(()=>{if(armed===id){armed=null;renderToday()}},3000);return}
  armed=null;await removeEntry(id);
});

/* ---------- settings ---------- */
function openSettings(){const G=goals();for(const k of ['k','p','c','f'])$('#g'+k).value=G[k]||'';$('#settings').hidden=false;setTimeout(()=>$('#gk').focus(),50)}
function closeSettings(){$('#settings').hidden=true}
$('#openSettings').addEventListener('click',openSettings);
$('#closeSettings').addEventListener('click',closeSettings);
$('#settings').addEventListener('click',e=>{if(e.target.id==='settings')closeSettings()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#settings').hidden)closeSettings()});
$('#goalForm').addEventListener('submit',async e=>{
  e.preventDefault();const g={};for(const k of ['k','p','c','f']){const v=Math.round(+$('#g'+k).value);if(v>0)g[k]=v}
  try{await saveGoals(g,true);closeSettings()}catch(err){sys(err&&err.code==='no_store'?'Targets save when this page is open in Claude.':"Couldn't save targets. Try again.");closeSettings()}
});

/* ---------- storage ---------- */
let chain=Promise.resolve();
const queue=fn=>{const p=chain.then(fn);chain=p.catch(()=>{});return p};
const col=()=>db&&state.uid?db.collection('data/users/'+state.uid):null;
function writeEntries(list){const c=col();if(!c)return Promise.reject({code:'no_store'});return queue(()=>c.doc(logId()).set({date:state.date,entries:list}))}
async function addEntry(entry,replaceId){const list=entries().filter(e=>e.id!==replaceId);list.push(entry);await writeEntries(list)}
async function removeEntry(id){try{await writeEntries(entries().filter(e=>e.id!==id))}catch(e){sys("Couldn't remove that. Try again.")}}
async function saveGoals(g,replaceAll){
  const c=col();if(!c)throw {code:'no_store'};
  const next=replaceAll?{}:{...goals()};for(const k of ['k','p','c','f'])if(g[k]!=null&&+g[k]>0)next[k]=Math.round(+g[k]);
  await queue(()=>c.doc('settings').set({...(state.settings||{}),goals:next}));
}

/* ---------- photo ---------- */
$('#camBtn').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;state.photo=f;$('#attImg').src=URL.createObjectURL(f);$('#att').hidden=false;updateSend();$('#txt').focus()});
$('#attX').addEventListener('click',()=>{state.photo=null;$('#att').hidden=true;updateSend()});
$('#txt').addEventListener('input',updateSend);
function updateSend(){$('#send').disabled=state.busy||(!state.photo&&!$('#txt').value.trim())}

/* ---------- thread ---------- */
function add(html,cls){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;$('#thread').append(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d}
function sys(t){add(esc(t),'bot')}
function mealCard(m){
  return `<div class="card">${m.items.map(i=>`<div class="row"><span>${esc(i.n)}${i.sv!==1?` ×${i.sv}`:''}</span><span>${fmt(i.k*i.sv)} cal · ${fmt(i.p*i.sv)} g</span></div>`).join('')}
    <div class="row tot"><span>Total</span><span>${fmt(m.tot.k)} cal · ${fmt(m.tot.p)} g protein</span></div></div>`;
}

/* ---------- Claude ---------- */
function instructions(){
  const items=menuList();const t=dayTot();const G=goals();
  const where=state.hall&&items.length?`They're at ${hallName()} dining hall. Its menu for today, from the official NetNutrition data (id | meal | station | item | one serving | kcal per serving):\n`+
    items.map(c=>`${c.id} | ${c.meal} | ${c.s||''} | ${c.n} | ${c.v}${c.g?` (${c.g}g)`:''} | ${Math.round(c.k)}`).join('\n')
    :state.hall?`They picked ${hallName()} dining hall, but its menu isn't loaded today.`:`They're not eating at a dining hall right now.`;
  return `You are the food logger inside Plate Log, a Vanderbilt student's personal macro tracker. Today is ${state.date}, local time ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.
The student tells you what they ate with a photo, a text message, or both. Figure out what they ate and how much; it gets logged automatically.

${where}

How to estimate:
- Dining-hall food: match each food to the menu item it most likely is and give menu_id plus servings (decimals like 0.5, 1.5), judging the amount against the serving size and grams. Use the plate (about 10 in), bowls, cups and utensils for scale. Include visible sauces, dressings, toppings and drinks.
- Anything else (snacks, packaged food, takeout, drinks, home food): set menu_id null, servings 1, and give calories, protein_g, carbs_g and fat_g as TOTALS for the amount eaten, using typical nutrition-label values for that product and amount.
- If their message corrects or adds to the food you logged in your previous reply ("actually two bags", "I also had a Coke with that"), return the full updated meal with "replaces_last": true.
- If they only ask a question or chat, answer it and set meal to null.
So far today: ${Math.round(t.k)} kcal, ${Math.round(t.p)} g protein, ${Math.round(t.c)} g carbs, ${Math.round(t.f)} g fat. Targets: ${G.k?G.k+' kcal':'none set'}${G.p?', '+G.p+' g protein':''}.

Reply with only JSON:
{"reply":"one short, friendly sentence","meal":{"title":"Lunch at Rand","items":[{"menu_id":"i12","label":"Al Pastor","servings":1.5},{"menu_id":null,"label":"Cheez-It, small handful","servings":1,"calories":75,"protein_g":1.5,"carbs_g":8.5,"fat_g":4}],"replaces_last":false}}
meal may be null. Titles and labels are short, the way a person would write them.`;
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();if(state.busy)return;
  const text=$('#txt').value.trim();const photo=state.photo;if(!text&&!photo)return;
  if(!sample){sys('Open this page in the Claude app or on claude.ai to log food.');return}
  rollDay();
  add(`${photo?`<img alt="Your photo" src="${URL.createObjectURL(photo)}">`:''}${text?`<span>${esc(text)}</span>`:''}`,'me');
  $('#txt').value='';state.photo=null;$('#att').hidden=true;
  const userTurn=(photo?'[Photo attached] ':'')+(text||'Photo only. Log what is in it.');
  const typing=add('<div class="typing"><i></i><i></i><i></i></div>','bot');
  state.busy=true;updateSend();$('#stop').hidden=false;$('#send').hidden=true;
  ctl=new AbortController();const items=menuList();
  try{
    const turns=[{role:'user',content:instructions()},...state.turns.slice(-10),{role:'user',content:userTurn}];
    const res=await sample.json(turns,{images:photo?[photo]:undefined,signal:ctl.signal,cache:false});
    typing.remove();
    const reply=String((res&&res.reply)||'Done.');
    let meal=null;
    if(res&&res.meal&&Array.isArray(res.meal.items)&&res.meal.items.length){
      const its=res.meal.items.map(it=>{
        const c=it.menu_id?items.find(x=>x.id===String(it.menu_id)):null;
        if(c)return {n:c.n,v:c.v||'',sv:Math.max(0.25,Math.round((+it.servings||1)*4)/4),k:r1(c.k),p:r1(c.p),c:r1(c.c),f:r1(c.f)};
        return {n:String(it.label||'Food'),v:'estimate',sv:1,k:r1(it.calories),p:r1(it.protein_g),c:r1(it.carbs_g),f:r1(it.fat_g)};
      });
      const tot=its.reduce((t,i)=>({k:t.k+i.k*i.sv,p:t.p+i.p*i.sv,c:t.c+i.c*i.sv,f:t.f+i.f*i.sv}),{k:0,p:0,c:0,f:0});
      meal={title:String(res.meal.title||'Food'),items:its,tot:{k:Math.round(tot.k),p:r1(tot.p),c:r1(tot.c),f:r1(tot.f)}};
    }
    const bubble=add(`<span>${esc(reply)}</span>${meal?mealCard(meal)+'<div class="state">Saving…</div>':''}`,'bot');
    state.turns.push({role:'user',content:userTurn});
    state.turns.push({role:'assistant',content:JSON.stringify({reply,meal:meal&&{title:meal.title,items:meal.items.map(i=>({label:i.n,servings:i.sv,calories:Math.round(i.k*i.sv),protein_g:r1(i.p*i.sv)}))}})});
    if(meal){
      const entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:new Date().toISOString(),hall:state.hall?hallName():'',meal:meal.title,items:meal.items,tot:meal.tot};
      const replace=res.meal.replaces_last&&state.lastLogged?state.lastLogged:null;
      const st=bubble.querySelector('.state');
      try{await addEntry(entry,replace);state.lastLogged=entry.id;st.innerHTML=`<span class="ok">${replace?'Updated':'Logged'} ✓</span><button type="button" data-undo="${entry.id}">Undo</button>`}
      catch(err){st.textContent=err&&err.code==='no_store'?'Not saved: open this page in Claude while signed in.':"Couldn't save. Send it again."}
    }
  }catch(err){typing.remove();if(!err||err.code!=='cancelled')sys(errCopy(err&&err.code))}
  finally{state.busy=false;$('#stop').hidden=true;$('#send').hidden=false;updateSend()}
});
$('#stop').addEventListener('click',()=>ctl&&ctl.abort());
$('#thread').addEventListener('click',async e=>{
  const b=e.target.closest('[data-undo]');if(!b)return;const id=b.dataset.undo;
  await removeEntry(id);if(state.lastLogged===id)state.lastLogged=null;b.parentElement.textContent='Removed';
});
function errCopy(code){
  return ({not_granted:"Claude isn't allowed on this page yet. Allow it from the page's Permissions menu.",
    sampling_disabled:"Claude isn't available on this account right now.",
    rate_limited:"You've hit a usage limit. Try again in a bit.",
    image_rejected:"That photo couldn't be read. Try a JPEG or PNG.",
    images_unavailable:"Photos can't be sent from this view. Try the Claude app or claude.ai.",
    invalid_json:"That answer came back garbled. Send it again.",
    refused:"Claude couldn't help with that one. Try describing the food.",
    session_expired:"Sign in to Claude again, then retry."}[code])||"Couldn't reach Claude. Send it again.";
}

/* ---------- day rollover ---------- */
function rollDay(){const d=dstr();if(d!==state.date){state.date=d;state.lastLogged=null;state.turns=[];renderDay();watchMenu();renderToday()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollDay()});

/* ---------- boot ---------- */
renderDay();renderHalls();renderToday();
(async()=>{
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [d,s,u]=await Promise.all([use('db'),use('sample'),use('user')]);
  db=d;sample=s;
  if(!sample||!db)sys('Open this page in the Claude app or on claude.ai to log food.');
  watchMenu();
  if(u&&db){try{state.uid=await u.id()}catch(e){state.uid=null}}
  if(state.uid){
    col().onSnapshot(snap=>{
      state.logs={};state.settings=null;
      for(const doc of snap.docs){if(doc.id==='settings')state.settings=doc.data();else if(doc.id.startsWith('log-'))state.logs[doc.id]=doc.data()}
      renderToday();
    },()=>{});
  }
})();
</script>
